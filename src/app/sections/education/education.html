<section id="education" class="section">
  <div class="container">
    <div class="section-head" appReveal>
      <span class="eyebrow">Education</span>
      <h2 class="section-title">Learning that <span class="gradient-text">shaped me</span>.</h2>
    </div>

    <div class="layout">
      <ol class="degrees">
        @for (item of education; track item.degree; let i = $index) {
          <li class="card degree" appReveal="left" [revealDelay]="i * 120">
            <span class="tag">{{ item.tag }}</span>
            <div>
              <h3>{{ item.degree }}</h3>
              <p>{{ item.school }}</p>
            </div>
            <app-icon name="graduation" class="deco" />
          </li>
        }
      </ol>

      <aside class="certs">
        @for (cert of certificates; track cert.title) {
          <div class="card cert" appReveal="right" [revealDelay]="200">
            <div class="cert-shine" aria-hidden="true"></div>
            <span class="icon-box big"><app-icon name="award" /></span>
            <span class="label">Certification</span>
            <h3>{{ cert.title }}</h3>
            <p>{{ cert.issuer }}</p>
          </div>
        }
      </aside>
    </div>
  </div>
</section>
