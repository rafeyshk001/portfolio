server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Hashed build output (main-XXXX.js, styles-XXXX.css) never changes, so cache it long-term.
    location ~* \.(?:js|css|woff2?|ttf|ico|png|jpe?g|gif|svg|webp|avif)$ {
        expires 1y;
        access_log off;
        try_files $uri =404;
    }

    # Always revalidate the HTML so new deployments show up immediately.
    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }
}
